services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mislaminas
      POSTGRES_PASSWORD: mislaminas
      POSTGRES_DB: mislaminas
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mislaminas -d mislaminas"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Descomenta si quieres acceder a Postgres desde el host.
    # ports:
    #   - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mislaminas:mislaminas@db:5432/mislaminas
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-una-cadena-larga-y-secreta}
      PORT: "3000"
      ALBUM_NAME: Mundial 2026
      # Magic link (Resend). Pon estos valores en un archivo .env (no se sube a git).
      # Sin RESEND_API_KEY, el enlace se imprime en los logs (modo desarrollo).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Mis Láminas <onboarding@resend.dev>}
      # Base pública para los enlaces (vacío = se deduce del request, ej. localhost).
      # En producción ponlo (ej. https://tu-dominio.com): es lo más seguro.
      APP_URL: ${APP_URL:-}
      # Si NO usas APP_URL, solo se aceptan estos hosts para construir enlaces
      # (evita que un Host: falso desvíe el enlace de la víctima).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      # Cambia el puerto del host con: HOST_PORT=8080 docker compose up
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  db_data:
